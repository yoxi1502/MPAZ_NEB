spring.application.name=ms-sesiones
server.port=8082

# Base de datos H2 guardada en archivo: los datos no se pierden al apagar el microservicio
spring.datasource.url=jdbc:h2:file:./data/sesiones;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea y actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Consola web de H2 para revisar las tablas: http://localhost:8082/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
