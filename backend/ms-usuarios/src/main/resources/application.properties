spring.application.name=ms-usuarios
server.port=8083

# Base de datos H2 guardada en archivo: los datos no se pierden al apagar el microservicio
spring.datasource.url=jdbc:h2:file:./data/usuarios;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea y actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Consola web de H2 para revisar las tablas: http://localhost:8083/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Crea las 2 cuentas de prueba (con la clave cifrada) si la tabla está vacía
mpaz.datos-iniciales.habilitado=true
